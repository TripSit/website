name: OpenUatToMainPR

on:
  push:
    branches:
      - uat

permissions:
  contents: read

jobs:
  open-pr:
    permissions:
      contents: read
      pull-requests: write
    name: Open PR to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Create PR from uat to main if none is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head uat --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing from uat to main is already open, nothing to do."
            exit 0
          fi

          # Right after a promotion uat has nothing main lacks, and gh pr create would refuse.
          # Check that case first, so any other gh failure (auth, API) fails the job.
          ahead=$(gh api "repos/${{ github.repository }}/compare/main...uat" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "uat has no commits that main lacks, nothing to promote."
            exit 0
          fi

          gh pr create \
            --base main \
            --head uat \
            --title "Promote uat to main" \
            --body "Auto-opened by the OpenUatToMainPR workflow after a push to \`uat\`. Merge to release these changes to production."

# Local development in Docker. `npm run website` builds the Dockerfile's `development`
# target, mounts src/ and public/ so edits reload, and serves http://localhost:3000.
#
# Neither deployment uses this file: signed hooks rebuild from each server's trusted
# compose configuration (see .drone.yml and docs/uat-deployment.md).
# The Traefik and Watchtower labels below mirror the servers' routing for
# reference and do nothing without that Traefik instance, so a routing change here (such as
# the website-staff router) has to be made in the servers' compose files as well.
version: '3.9'

name: service

########################### EXTENSION FIELDS
# Common environment values
x-environment: &default-tz-puid-pgid
  TZ: 'America/Chicago'
  PUID: '1000'
  PGID: '1000'

# Keys common to some of the dependent services/apps
x-common-keys-apps: &common-keys-apps
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

########################### SERVICES
services:
  website:
    <<: *common-keys-apps
    build:
      context: ./
      dockerfile: ./Dockerfile
      # Only will build development stage from our dockerfile
      target: development
    container_name: website
    working_dir: /usr/src/app
    ports:
      - 3000:3000
    environment:
      <<: *default-tz-puid-pgid
      STAFF_SITE_ORIGIN: ${STAFF_SITE_ORIGIN:-}
      STAFF_KEYCLOAK_ISSUER: ${STAFF_KEYCLOAK_ISSUER:-}
      STAFF_KEYCLOAK_CLIENT_ID: ${STAFF_KEYCLOAK_CLIENT_ID:-}
      STAFF_KEYCLOAK_CLIENT_SECRET: ${STAFF_KEYCLOAK_CLIENT_SECRET:-}
      STAFF_COOKIE_SECRET: ${STAFF_COOKIE_SECRET:-}
      TRIPBOT_API_URL: ${TRIPBOT_API_URL:-}
    volumes:
      - ./src:/usr/src/app/src
      - ./public:/usr/src/app/public
    networks:
      website-net:
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - traefik.enable=true
      - traefik.docker.network=website-net
      - traefik.http.services.website-svc.loadbalancer.server.port=3000

      - traefik.http.routers.website.rule=Host(`${DNS_DOMAIN}`) || Host(`chat.${DNS_DOMAIN}`) || Host(`drugs.${DNS_DOMAIN}`)
      - traefik.http.routers.website.service=website-svc
      - traefik.http.routers.website.tls.certresolver=letsencrypt
      - traefik.http.routers.website.middlewares=default@file,redirectFactsheets@file,redirectWebchat@file
      - traefik.http.routers.website.entrypoints=websecure

      # Staff auth/proxy endpoints belong to Next.js; TripBot otherwise captures /api.
      - traefik.http.routers.website-staff.rule=Host(`${DNS_DOMAIN}`) && (Path(`/api/staff`) || PathPrefix(`/api/staff/`))
      - traefik.http.routers.website-staff.priority=1000
      - traefik.http.routers.website-staff.service=website-svc
      - traefik.http.routers.website-staff.entrypoints=websecure
      - traefik.http.routers.website-staff.tls.certresolver=letsencrypt
      - traefik.http.routers.website-staff.middlewares=default@file

########################### NETWORKS
networks:
  website-net:
    name: website-net
    # external: true
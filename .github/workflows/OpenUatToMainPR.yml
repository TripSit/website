name: OpenUatToMainPR

on:
  push:
    branches:
      - uat

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Open PR to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PR from uat to main if none is open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --base main --head uat --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing from uat to main is already open, nothing to do."
            exit 0
          fi

          # Fails harmlessly if uat and main have no diff (e.g. right after a promotion merge).
          gh pr create \
            --base main \
            --head uat \
            --title "Promote uat to main" \
            --body "Auto-opened by the OpenUatToMainPR workflow after a push to \`uat\`. Merge to release these changes to production." \
            || echo "No PR created (likely no diff between uat and main)."

name: PushToUat

on:
  push:
    branches:
      - uat

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Linting
        run: npx eslint .
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        # `next build` runs the TypeScript check as part of the build, so a
        # separate `tsc --noEmit` step is redundant (and would fail anyway,
        # since next-env.d.ts is only generated by the Next.js CLI).
        run: npx next build
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build website image (production target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript"
  sonar:
    name: SonarScan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Copy env
        run: cp .env.example .env
      - name: Test with coverage
        # Writes coverage/lcov.info, which sonar-project.properties points the scanner at.
        run: npm run test:coverage
      - name: SonarQube scan
        # Still upload the analysis if a test or the coverage threshold fails.
        if: ${{ !cancelled() }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Show why the quality gate failed
        # The scanner only prints "QUALITY GATE STATUS: FAILED", and the dashboard sits behind a
        # sign-in. List the failing conditions and the new-code issues and hotspots here instead.
        # Read-only API calls; the token never reaches the output.
        if: ${{ failure() && !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          key=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)
          api() { curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" "${SONAR_HOST_URL%/}/api/$1"; }
          # If the scan itself failed (e.g. a plugin download), the server still holds the
          # previous analysis, so check the scanner output above before reading these.
          echo "::group::Quality gate conditions (latest analysis on the server)"
          api "qualitygates/project_status?projectKey=$key" |
            jq -r '.projectStatus.conditions[] | "\(.status)\t\(.metricKey)\t\(.actualValue // "-") (fails if \(.comparator) \(.errorThreshold))"'
          echo "::endgroup::"
          echo "::group::Open issues in new code"
          api "issues/search?components=$key&inNewCodePeriod=true&resolved=false&ps=100" |
            jq -r '.issues[] | "\(.component | sub("^[^:]*:"; "")):\(.line // 0)\t\(.rule)\t\(.message)"'
          echo "::endgroup::"
          echo "::group::Security hotspots in new code to review"
          # The scan token may lack permission to browse hotspots (HTTP 403); say so and go on.
          if hotspots=$(api "hotspots/search?projectKey=$key&inNewCodePeriod=true&status=TO_REVIEW&ps=100"); then
            jq -r '.hotspots[] | "\(.component | sub("^[^:]*:"; "")):\(.line // 0)\t\(.ruleKey // .securityCategory)\t\(.message)"' <<<"$hotspots"
          else
            echo "(the scan token cannot list hotspots; check the dashboard)"
          fi
          echo "::endgroup::"

# Required
sonar.projectKey=TripSit_website_AYoAUAAYALmA62is8Npk
sonar.projectName=Website
sonar.projectVersion=6.0
sonar.connectionId=https-sonar-tripsit-me-
sonar.host.url=https://sonar.tripsit.me
sonar.sourceEncoding=UTF-8

# Tests live next to the code in __tests__ folders, so both scopes start at src/
# and the test files are moved out of the source scope and into the test scope.
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/__tests__/**
sonar.test.inclusions=src/**/__tests__/**

# Tailwind v4 at-rules such as @theme aren't standard CSS, so Sonar's unknown-at-rule
# check (css:S4662) misreads the Tailwind entry file.
sonar.issue.ignore.multicriteria=tailwind
sonar.issue.ignore.multicriteria.tailwind.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.tailwind.resourceKey=src/styles/tailwind.css

# Coverage from `npm run test:coverage` (Jest writes coverage/lcov.info).
# CI runs the tests before the scan; without this file Sonar reports 0% coverage.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

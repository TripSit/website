name: PullRequestOpen

on:
  pull_request:
    branches:
      - main
      - uat
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

  merge_group:
    types: [checks_requested]
    branches: [uat]

permissions:
  contents: read

concurrency:
  group: pr-open-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Linting
        run: npx eslint .
      - name: Lint delivery controls
        env:
          ESLINT_USE_FLAT_CONFIG: "true"
        run: npx eslint --no-ignore --config .github/scripts/eslint.config.mjs .github/scripts/*.cjs .github/scripts/*.mjs
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build
        # `next build` runs the TypeScript check as part of the build, so a
        # separate `tsc --noEmit` step is redundant (and would fail anyway,
        # since next-env.d.ts is only generated by the Next.js CLI).
        run: npx next build
  docker-build:
    # Same job and name as in PushToUat.yml, so a broken Dockerfile fails the PR instead of
    # the build after merging (CICD-POLICY.md section 2 lists Docker Build as a PR check).
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build website image (production target)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Copy env
        run: cp .env.example .env
      - name: Test
        run: npm run test:coverage -- --json --outputFile=jest-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jest-results
          path: jest-results.json
          retention-days: 1
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
  sonar:
    needs: test
    name: SonarScan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coverage
          path: coverage
      - name: Verify coverage report
        run: test -s coverage/lcov.info
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Show why the quality gate failed
        # The scanner only prints "QUALITY GATE STATUS: FAILED", and the dashboard sits behind a
        # sign-in. List the failing conditions and the new-code issues and hotspots here instead.
        # Read-only API calls; the token never reaches the output.
        if: ${{ failure() && !cancelled() }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          key=$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)
          api() { curl -fsS -H "Authorization: Bearer $SONAR_TOKEN" "${SONAR_HOST_URL%/}/api/$1"; }
          # If the scan itself failed (e.g. a plugin download), the server still holds the
          # previous analysis, so check the scanner output above before reading these.
          echo "::group::Quality gate conditions (latest analysis on the server)"
          api "qualitygates/project_status?projectKey=$key" |
            jq -r '.projectStatus.conditions[] | "\(.status)\t\(.metricKey)\t\(.actualValue // "-") (fails if \(.comparator) \(.errorThreshold))"'
          echo "::endgroup::"
          echo "::group::Open issues in new code"
          api "issues/search?components=$key&inNewCodePeriod=true&resolved=false&ps=100" |
            jq -r '.issues[] | "\(.component | sub("^[^:]*:"; "")):\(.line // 0)\t\(.rule)\t\(.message)"'
          echo "::endgroup::"
          echo "::group::Security hotspots in new code to review"
          # The scan token may lack permission to browse hotspots (HTTP 403); say so and go on.
          if hotspots=$(api "hotspots/search?projectKey=$key&inNewCodePeriod=true&status=TO_REVIEW&ps=100"); then
            jq -r '.hotspots[] | "\(.component | sub("^[^:]*:"; "")):\(.line // 0)\t\(.ruleKey // .securityCategory)\t\(.message)"' <<<"$hotspots"
          else
            echo "(the scan token cannot list hotspots; check the dashboard)"
          fi
          echo "::endgroup::"
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066
        with:
          category: "/language:javascript"

  release-policy-tests:
    name: Release policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/release-policy.test.mjs
      - run: python3 .github/scripts/configure-cicd.test.py

  ci-passed:
    name: CI Passed
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, build, docker-build, test, sonar, codeql, release-policy-tests]
    steps:
      - name: Require every validation job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const r=JSON.parse(process.env.RESULTS); if(!Object.keys(r).length || Object.values(r).some(j=>j.result!=="success")) process.exit(1)'
